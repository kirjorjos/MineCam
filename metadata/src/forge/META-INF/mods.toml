modLoader = "javafml"
loaderVersion = "${forge_loader_req}"
issueTrackerURL = "${issue_tracker_url}"
license = "${licence}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${name}"
displayURL = "${homepage_url}"
logoFile = "icon.png"
logoBlur = true
authors = "${authors}"
description = '''
${description}
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_req}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${forge_mc_req}"
ordering = "NONE"
side = "CLIENT"

# Optional in both directions: the fork is usable standalone (F10), and Minecheck installs it only
# to own the human's camera. Neither mod may require the other.
[[dependencies.${mod_id}]]
modId = "minecheck"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"